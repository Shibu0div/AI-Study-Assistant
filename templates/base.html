<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Study Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('index') }}">AI Study Assistant</a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Home</a>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('study') }}">Study</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a class="nav-cta" href="{{ url_for('signup') }}">Get Started</a>
      {% endif %}
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">
    <span>AI Study Assistant</span>
    <span>Powered by Amazon Bedrock</span>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
