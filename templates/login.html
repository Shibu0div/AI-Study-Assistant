{% extends "base.html" %}
{% block title %}Login | AI Study Assistant{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-heading"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p>Continue your study session.</p></div>
    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="button primary full" type="submit">Login</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="{{ url_for('signup') }}">Create one</a></p>
  </div>
</section>
{% endblock %}
